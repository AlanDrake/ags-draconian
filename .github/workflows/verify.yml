name: Format check

# All first-party C/C++ files must be clang-format clean (docs/refactor/PLAN.md, tasks 2.1/2.2).
# Third-party and unformatted directories carry a .clang-format with "DisableFormat: true".

on: [push, pull_request]

permissions:
  contents: read

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Pinned: different clang-format versions format differently (docs/refactor/STYLE.md)
      - name: Install clang-format
        run: pip install clang-format==19.1.7

      - name: Check formatting
        run: |
          git ls-files '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hpp' '*.inl' \
            | xargs clang-format --dry-run -Werror
