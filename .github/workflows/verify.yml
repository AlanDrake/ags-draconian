name: Verify

# The fast gate, on every push to any branch (docs/refactor/PLAN.md, 2.1, 2.4, 2.6, 2.8, 2.9): formatting,
# one Linux build with the unit tests and the auto-test game, the GCC and clang+libc++ header checks, and
# clang-tidy on the changed lines. ci.yml is the full build; on a push it leaves the Linux x86_64 build
# to this workflow.
# Script/prepush.py runs the same checks (and the MSVC ones) locally, so this should only confirm.
# The compiler jobs keep a ccache between runs (2.9): a push that changes a few files compiles those.

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.git-blame-ignore-revs'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  # The auto-test project, at the tag ci.yml builds
  AUTO_TEST_REPO: AlanDrake/ags-test-games
  AUTO_TEST_TAG: draconian-auto-test-1
  # CMake reads the launcher from the environment (3.17+), so every configure step below uses ccache,
  # the downloaded dependencies included
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CCACHE_MAXSIZE: 500M

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Pinned: different clang-format versions format differently (docs/refactor/STYLE.md)
      - name: Install clang-format
        run: pip install clang-format==19.1.7

      # Third-party and unformatted directories carry a .clang-format with "DisableFormat: true"
      - name: Check formatting
        run: |
          git ls-files '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hpp' '*.inl' \
            | xargs clang-format --dry-run -Werror

  linux:
    name: Linux (GCC)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0    # the clang-tidy step diffs against the push's previous commit

      - name: Check out the auto-test project
        uses: actions/checkout@v6
        with:
          repository: ${{env.AUTO_TEST_REPO}}
          ref: ${{env.AUTO_TEST_TAG}}
          path: auto-test-source
          persist-credentials: false

      - name: Find the runner image version
        id: apt-image
        run: echo "image=$ImageVersion" >> "$GITHUB_OUTPUT"

      # Only the packages' files are cached, apt checks every .deb against the fresh index. "1": raise it to drop the cache by hand
      - name: Cache apt packages
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-1-${{ runner.os }}-${{ runner.arch }}-${{ steps.apt-image.outputs.image }}-${{ hashFiles('.github/workflows/verify.yml') }}

      - name: Set up SDL dependencies on Linux (ensures OpenGL)
        run: |
          mkdir -p "$RUNNER_TEMP/apt-archives"
          sudo apt-get update -y
          sudo apt-get -o Dir::Cache::archives="$RUNNER_TEMP/apt-archives" install -y ccache \
            gnome-desktop-testing libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev \
            libusb-1.0-0-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev fcitx-libs-dev
          sudo rm -rf "$RUNNER_TEMP/apt-archives/partial" "$RUNNER_TEMP/apt-archives/lock"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/apt-archives"
          du -sh "$RUNNER_TEMP/apt-archives"

      - name: Set up Tappy
        run: pip install tap.py

      - name: Cache CMake dependency archives
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/ags-deps
          key: ags-deps-${{ hashFiles('CMake/Fetch*.cmake') }}

      - name: Download CMake dependency archives
        run: |
          Script/fetch_deps.sh "$RUNNER_TEMP/ags-deps"
          echo "AGS_FETCH_MIRROR_DIR=$RUNNER_TEMP/ags-deps" >> "$GITHUB_ENV"

      - name: Cache CMake FetchContent dependencies
        uses: actions/cache@v5
        with:
          path: ${{github.workspace}}/build/_deps
          key: fetchcontent-verify-gcc-${{ hashFiles('CMakeLists.txt', 'CMake/Fetch*.cmake') }}

      # A cache is never overwritten, so every commit saves its own and the next one starts from the newest
      - name: Compiler cache
        uses: actions/cache@v5
        with:
          path: ${{github.workspace}}/.ccache
          key: ccache-verify-gcc-${{ github.sha }}
          restore-keys: ccache-verify-gcc-

      # AGS_WARNINGS_AS_ERRORS: a warning in a target that builds without any (Common) fails the build (PLAN.md, 1.5)
      - name: Configure CMake
        run: cmake -S "${{github.workspace}}" -B "${{github.workspace}}/build" -DAGS_BUILD_TOOLS=1 -DAGS_TESTS=1 -DAGS_HEADER_CHECK=1 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DAGS_WARNINGS_AS_ERRORS=ON -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

      # -k: a warning that became an error should not hide the next ones. The statistics start here: the
      # configure step's compiler checks are in scratch directories with random names and never hit.
      - name: Build
        run: |
          ccache --zero-stats
          cmake --build "${{github.workspace}}/build" --parallel 8 -- -k

      - name: Check that headers are self-contained (GCC)
        run: cmake --build "${{github.workspace}}/build" --target header_check --parallel 8 -- -k

      - name: Compiler cache statistics
        if: ${{ !cancelled() }}
        run: ccache --show-stats --verbose

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: ctest --output-on-failure

      # The game is built from its source by the tools of this build, in strict mode, and run in the engine
      # of this build with both renderers. ci.yml does the same on the other platforms, and on this one
      # only when the event is not a push (its plan job).
      - name: Build the auto-test game
        run: Script/agsbuild_autotest.sh "${{github.workspace}}/build" auto-test-source/ags4/auto-test "${{runner.temp}}/autotest" --build-only

      - name: Run auto-test (Hardware GFX)
        working-directory: ${{runner.temp}}/autotest/out
        run: |
          "${{github.workspace}}/build/ags" --gfxdriver OGL --no-message-box --log-stdout=script:info,main:debug,game:warn --user-data-dir . "$(basename "$(ls ./*.ags | head -n 1)")"
          mv agstest.tap agstest_hardware.tap
          tappy agstest_hardware.tap

      - name: Run auto-test (Software GFX)
        working-directory: ${{runner.temp}}/autotest/out
        run: |
          "${{github.workspace}}/build/ags" --gfxdriver Software --no-message-box --log-stdout=script:info,main:debug,game:warn --user-data-dir . "$(basename "$(ls ./*.ags | head -n 1)")"
          mv agstest.tap agstest_software.tap
          tappy agstest_software.tap

      # Naming and size rules of the root .clang-tidy for the lines this push changed; the legacy code
      # is not checked (docs/refactor/PLAN.md, 2.4). A new branch or a force push, whose previous commit
      # is unknown, is compared with the default branch. Script/prepush.py runs the same script (stage tidy).
      - name: Install clang-tidy
        run: pip install clang-tidy==19.1.0

      - name: clang-tidy on changed lines
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base="$BEFORE"
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] \
              || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git merge-base HEAD origin/ags4draconianr21)
          fi
          python3 Script/tidy_diff.py --build "${{github.workspace}}/build" --base "$base"

  # libc++ without its transitive includes is the strictest standard library the platforms use: it finds
  # what GCC finds, and what MSVC hides (Script/header_check_libcxx.py does the same locally)
  headers-clang:
    name: Headers (clang, libc++)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Find the runner image version
        id: apt-image
        run: echo "image=$ImageVersion" >> "$GITHUB_OUTPUT"

      # Only the packages' files are cached, apt checks every .deb against the fresh index. "1": raise it to drop the cache by hand
      - name: Cache apt packages
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-1-${{ runner.os }}-${{ runner.arch }}-${{ steps.apt-image.outputs.image }}-${{ hashFiles('.github/workflows/verify.yml') }}

      - name: Set up clang, libc++ and SDL dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/apt-archives"
          sudo apt-get update -y
          sudo apt-get -o Dir::Cache::archives="$RUNNER_TEMP/apt-archives" install -y ccache clang libc++-dev libc++abi-dev \
            gnome-desktop-testing libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev \
            libusb-1.0-0-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev fcitx-libs-dev
          sudo rm -rf "$RUNNER_TEMP/apt-archives/partial" "$RUNNER_TEMP/apt-archives/lock"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/apt-archives"
          du -sh "$RUNNER_TEMP/apt-archives"

      - name: Cache CMake dependency archives
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/ags-deps
          key: ags-deps-${{ hashFiles('CMake/Fetch*.cmake') }}

      - name: Download CMake dependency archives
        run: |
          Script/fetch_deps.sh "$RUNNER_TEMP/ags-deps"
          echo "AGS_FETCH_MIRROR_DIR=$RUNNER_TEMP/ags-deps" >> "$GITHUB_ENV"

      - name: Cache CMake FetchContent dependencies
        uses: actions/cache@v5
        with:
          path: ${{github.workspace}}/build/_deps
          key: fetchcontent-verify-clang-${{ hashFiles('CMakeLists.txt', 'CMake/Fetch*.cmake') }}

      - name: Compiler cache
        uses: actions/cache@v5
        with:
          path: ${{github.workspace}}/.ccache
          key: ccache-verify-clang-${{ github.sha }}
          restore-keys: ccache-verify-clang-

      - name: Configure CMake
        run: |
          cmake -S "${{github.workspace}}" -B "${{github.workspace}}/build" -DAGS_BUILD_TOOLS=1 -DAGS_TESTS=1 -DAGS_HEADER_CHECK=1 \
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            "-DAGS_HEADER_CHECK_FLAGS=-stdlib=libc++ -D_LIBCPP_REMOVE_TRANSITIVE_INCLUDES"

      # The libraries build with the default standard library; only the header stubs use libc++
      - name: Check that headers are self-contained (clang, libc++)
        run: |
          ccache --zero-stats
          cmake --build "${{github.workspace}}/build" --target header_check --parallel 8 -- -k

      - name: Compiler cache statistics
        if: ${{ !cancelled() }}
        run: ccache --show-stats --verbose
