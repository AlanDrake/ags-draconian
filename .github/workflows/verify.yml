name: Verify

# The fast gate, on every push to any branch (docs/refactor/PLAN.md, 2.1, 2.4, 2.6, 2.8): formatting, one
# Linux build with tests, the GCC and clang+libc++ header checks, and clang-tidy on the changed lines.
# ci.yml is the full build.
# Script/prepush.py runs the same checks (and the MSVC ones) locally, so this should only confirm.

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.git-blame-ignore-revs'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Pinned: different clang-format versions format differently (docs/refactor/STYLE.md)
      - name: Install clang-format
        run: pip install clang-format==19.1.7

      # Third-party and unformatted directories carry a .clang-format with "DisableFormat: true"
      - name: Check formatting
        run: |
          git ls-files '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hpp' '*.inl' \
            | xargs clang-format --dry-run -Werror

  linux:
    name: Linux (GCC)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0    # the clang-tidy step diffs against the push's previous commit
      - name: Set up SDL dependencies on Linux (ensures OpenGL)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            gnome-desktop-testing libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev \
            libusb-1.0-0-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev fcitx-libs-dev

      - name: Cache CMake FetchContent dependencies
        uses: actions/cache@v5
        with:
          path: ${{github.workspace}}/build/_deps
          key: fetchcontent-verify-gcc-${{ hashFiles('CMakeLists.txt', 'CMake/Fetch*.cmake') }}

      # AGS_WARNINGS_AS_ERRORS: a warning in a target that builds without any (Common) fails the build (PLAN.md, 1.5)
      - name: Configure CMake
        run: cmake -S "${{github.workspace}}" -B "${{github.workspace}}/build" -DAGS_BUILD_TOOLS=1 -DAGS_TESTS=1 -DAGS_HEADER_CHECK=1 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DAGS_WARNINGS_AS_ERRORS=ON -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

      # -k: a warning that became an error should not hide the next ones
      - name: Build
        run: cmake --build "${{github.workspace}}/build" --parallel 8 -- -k

      - name: Check that headers are self-contained (GCC)
        run: cmake --build "${{github.workspace}}/build" --target header_check --parallel 8 -- -k

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: ctest --output-on-failure

      # Naming and size rules of the root .clang-tidy for the lines this push changed; the legacy code
      # is not checked (docs/refactor/PLAN.md, 2.4). A new branch or a force push, whose previous commit
      # is unknown, is compared with the default branch. Script/prepush.py runs the same script (stage tidy).
      - name: Install clang-tidy
        run: pip install clang-tidy==19.1.0

      - name: clang-tidy on changed lines
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base="$BEFORE"
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] \
              || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git merge-base HEAD origin/ags4draconianr21)
          fi
          python3 Script/tidy_diff.py --build "${{github.workspace}}/build" --base "$base"

  # libc++ without its transitive includes is the strictest standard library the platforms use: it finds
  # what GCC finds, and what MSVC hides (Script/header_check_libcxx.py does the same locally)
  headers-clang:
    name: Headers (clang, libc++)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up clang, libc++ and SDL dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang libc++-dev libc++abi-dev \
            gnome-desktop-testing libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev \
            libusb-1.0-0-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev fcitx-libs-dev

      - name: Cache CMake FetchContent dependencies
        uses: actions/cache@v5
        with:
          path: ${{github.workspace}}/build/_deps
          key: fetchcontent-verify-clang-${{ hashFiles('CMakeLists.txt', 'CMake/Fetch*.cmake') }}

      - name: Configure CMake
        run: |
          cmake -S "${{github.workspace}}" -B "${{github.workspace}}/build" -DAGS_BUILD_TOOLS=1 -DAGS_TESTS=1 -DAGS_HEADER_CHECK=1 \
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            "-DAGS_HEADER_CHECK_FLAGS=-stdlib=libc++ -D_LIBCPP_REMOVE_TRANSITIVE_INCLUDES"

      # The libraries build with the default standard library; only the header stubs use libc++
      - name: Check that headers are self-contained (clang, libc++)
        run: cmake --build "${{github.workspace}}/build" --target header_check --parallel 8 -- -k
