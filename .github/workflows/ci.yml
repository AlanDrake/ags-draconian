name: CI

# The full build (docs/refactor/PLAN.md, 2.8). It runs on the ags4draconian* branches, release tags,
# pull requests, weekly and on demand; verify.yml (the fast gate) runs on every push. Only a tag, the
# schedule and a manual run with full=true build every platform and the packages; the rest build the
# light set (see the plan job). Run Script/prepush.py before pushing, so that these only confirm.
on:
  push:
    branches: ['ags4draconian*']
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.git-blame-ignore-revs'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.git-blame-ignore-revs'
      - '.github/ISSUE_TEMPLATE/**'
  schedule:
    - cron: '0 4 * * 1'   # Mondays 04:00 UTC; GitHub runs it on the default branch only
  workflow_dispatch:
    inputs:
      full:
        description: 'Run every platform, the packages and the release job'
        type: boolean
        default: true

# A newer push to the same ref replaces the running one; a release tag is never cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read
  packages: read

env:
  BASE_BRANCH: ags4
  MANUAL_ASSET: ags4-help.chm
  # Fork-owned auto-test game, built with this fork's editor (docs/refactor/PLAN.md, task 1.1).
  # Pinned to a release tag: bump AUTO_TEST_TAG deliberately when the test game changes.
  AUTO_TEST_REPO: AlanDrake/ags-test-games
  AUTO_TEST_TAG: draconian-auto-test-1
  AUTO_TEST_ASSET_BASENAME: ags4-auto-test
  BUILD_TYPE: Release

jobs:
  # The one place that decides what runs. A full run is a tag push, the weekly schedule, or a manual
  # run with full=true (the default): `gh workflow run ci.yml --ref <branch> -f full=true`. Any other
  # push or pull request builds the light platforms only (Windows MSVC and Ubuntu x86_64, which also
  # run the auto-test game) plus the Windows MSVC jobs. Heavy jobs say `if: needs.plan.outputs.full == 'true'`.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.plan.outputs.full }}
      platforms: ${{ steps.plan.outputs.platforms }}
    steps:
    - name: Decide
      id: plan
      env:
        FULL: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full == true) }}
      run: |
        cat > platforms.json <<'EOF'
        [
          { "light": false, "name": "Win-mingw-x86_64", "os": "windows-2022",     "sys": "Windows", "gfx": "D3D9", "artifact": "ags-mingw-x86_64", "shell": "msys2 {0}", "runbin": "./ags",      "bindir": "",        "cmakecmd": "cmake", "msystem": "mingw64", "msys-env": "mingw-w64-x86_64" },
          { "light": false, "name": "Win-mingw-arm64",  "os": "windows-11-arm",   "sys": "Windows", "gfx": "D3D9", "artifact": "ags-mingw-arm64",  "shell": "msys2 {0}", "runbin": "./ags",      "bindir": "",        "cmakecmd": "cmake", "msystem": "clangarm64", "msys-env": "mingw-w64-clang-aarch64" },
          { "light": true,  "name": "Windows",          "os": "windows-2022",     "sys": "Windows", "gfx": "D3D9", "artifact": "ags-windows",      "shell": "cmd",       "runbin": ".\\ags.exe", "bindir": "Release", "cmakecmd": "cmake" },
          { "light": true,  "name": "Ubuntu-x86_64",    "os": "ubuntu-latest",    "sys": "Ubuntu",  "gfx": "OGL",  "artifact": "ags-linux-x86_64", "shell": "sh",        "runbin": "./ags",      "bindir": "",        "cmakecmd": "cmake" },
          { "light": false, "name": "Ubuntu-Arm64",     "os": "ubuntu-22.04-arm", "sys": "Ubuntu",  "gfx": "OGL",  "artifact": "ags-linux-Arm64",  "shell": "sh",        "runbin": "./ags",      "bindir": "",        "cmakecmd": "cmake" },
          { "light": false, "name": "macOS",            "os": "macos-latest",     "sys": "macOS",   "gfx": "OGL",  "artifact": "ags-macos",        "shell": "sh",        "runbin": "./ags",      "bindir": "",        "cmakecmd": "cmake" }
        ]
        EOF
        if [ "$FULL" = "true" ]; then
          filter='.'
        else
          filter='map(select(.light))'
        fi
        echo "full=$FULL" >> "$GITHUB_OUTPUT"
        echo "platforms=$(jq -c "{platform: ($filter)}" platforms.json)" >> "$GITHUB_OUTPUT"
        cat "$GITHUB_OUTPUT"

  # Builds the auto-test game from its source with the C++ tools of this run, in strict mode, for the
  # platform jobs to run (docs/refactor/PLAN.md, 7.1j and 1.7). The project is checked out at the same
  # tag the hand-made release had.
  auto-test-game:
    name: Auto-test game
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Check out the auto-test project
      uses: actions/checkout@v6
      with:
        repository: ${{env.AUTO_TEST_REPO}}
        ref: ${{env.AUTO_TEST_TAG}}
        path: auto-test-source
        persist-credentials: false

    - name: Cache CMake FetchContent dependencies
      uses: actions/cache@v5
      with:
        path: ${{github.workspace}}/build/_deps
        key: fetchcontent-${{ runner.os }}-tools-${{ hashFiles('CMakeLists.txt', 'CMake/Fetch*.cmake') }}

    - name: Build the tools
      run: |
        cmake -S . -B build -DAGS_BUILD_TOOLS=1 -DAGS_BUILD_ENGINE=0 -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        cmake --build build --parallel 8

    - name: Build the auto-test with agsbuild
      run: |
        Script/agsbuild_autotest.sh build auto-test-source/ags4/auto-test ${{runner.temp}}/agsbuild-autotest --build-only

    - name: Upload the game
      uses: actions/upload-artifact@v7
      with:
        name: auto-test-game
        if-no-files-found: error
        path: |
          ${{runner.temp}}/agsbuild-autotest/out/${{env.AUTO_TEST_ASSET_BASENAME}}.ags
          ${{runner.temp}}/agsbuild-autotest/out/acsetup.cfg

  build:
    name: ${{ matrix.platform.name }}
    needs: [plan, auto-test-game]
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: ${{ matrix.platform.shell }}

    strategy:
      fail-fast: false
      # {"platform": [...]} from the plan job: the light entries, or all six on a full run
      matrix: ${{ fromJSON(needs.plan.outputs.platforms) }}

    steps:
    - name: Set up MSYS2
      if: matrix.platform.shell == 'msys2 {0}'
      uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c #v2
      with:
        msystem: ${{ matrix.platform.msystem }}
        install: >-
          ${{ matrix.platform.msys-env }}-cc
          ${{ matrix.platform.msys-env }}-cmake
          ${{ matrix.platform.msys-env }}-ninja
          ${{ matrix.platform.msys-env }}-perl
          ${{ matrix.platform.msys-env }}-python-pip
          ${{ matrix.platform.msys-env }}-pkg-config
          ${{ matrix.platform.msys-env }}-clang-tools-extra
          unzip

    - name: Set up SDL dependencies on Linux (ensures OpenGL)
      if: matrix.platform.sys == 'Ubuntu'
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          gnome-desktop-testing libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev \
          libusb-1.0-0-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
          libxss-dev libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
          libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev fcitx-libs-dev

    - name: Set up Tappy
      run: pip install tap.py

    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Cache CMake FetchContent dependencies
      uses: actions/cache@v5
      with:
        path: ${{github.workspace}}/build/_deps
        key: fetchcontent-${{ runner.os }}-${{ matrix.platform.name }}-${{ hashFiles('CMakeLists.txt', 'CMake/Fetch*.cmake') }}

    - name: Configure CMake
      run: |
        cmake --version
        ${{ matrix.platform.cmakecmd }} -S "${{github.workspace}}" -B "${{github.workspace}}/build" -DAGS_BUILD_TOOLS=1 -DAGS_TESTS=1 -DAGS_HEADER_CHECK=1 -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build "${{github.workspace}}/build" --config ${{env.BUILD_TYPE}} --parallel 8

    # Every header must compile on its own (docs/refactor/PLAN.md, 2.6); MSVC here, GCC and clang+libc++ in verify.yml
    - name: Check that headers are self-contained
      if: matrix.platform.name == 'Windows'
      run: cmake --build "${{github.workspace}}/build" --config ${{env.BUILD_TYPE}} --target header_check --parallel 8

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure

    - name: Upload runtime artifacts
      uses: actions/upload-artifact@v7
      with:
        name: runtime-${{ matrix.platform.artifact }}-cmake
        path: |
          ${{github.workspace}}/build/${{env.BUILD_TYPE}}/ags.exe
          ${{github.workspace}}/build/ags
          ${{github.workspace}}/build/ags.exe

    # The tools and the engine of this build, for the parity job (7.1j)
    - name: Stage tools for the parity harness
      if: matrix.platform.name == 'Windows'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path parity-tools | Out-Null
        $names = 'agsbuild','agscc','agf2dta','agf2dlgasc','agfexport','agspak','crmbuild','crmpak','po2tra','spriteimport','spritepak','ags'
        foreach ($n in $names) {
          $f = Get-ChildItem build -Recurse -Filter "$n.exe" | Where-Object { $_.FullName -notmatch '[\\/]_deps[\\/]' } | Select-Object -First 1
          if (-not $f) { throw "Not found in build: $n.exe" }
          Copy-Item $f.FullName parity-tools
        }
        Copy-Item build\Release\*.dll parity-tools -ErrorAction SilentlyContinue

    - name: Upload tools for the parity harness
      if: matrix.platform.name == 'Windows'
      uses: actions/upload-artifact@v7
      with:
        name: parity-tools-windows
        path: parity-tools

    # The game built by auto-test-game from its source
    - name: Download auto-test
      uses: actions/download-artifact@v8
      with:
        name: auto-test-game
        path: ${{github.workspace}}/build/${{matrix.platform.bindir}}

    - name: Run auto-test (Hardware GFX)
      working-directory: ${{github.workspace}}/build/${{matrix.platform.bindir}}
      run: |
        ${{matrix.platform.runbin}} --gfxdriver ${{matrix.platform.gfx}} --no-message-box --log-stdout=script:info,main:debug,game:warn --user-data-dir . ${{env.AUTO_TEST_ASSET_BASENAME}}.ags
        mv agstest.tap agstest_hardware.tap

    - name: Check auto-test (Hardware GFX) # we are using tap.py so that the pipeline fails if a test fails
      working-directory: ${{github.workspace}}/build/${{matrix.platform.bindir}}
      run: |
        tappy agstest_hardware.tap

    - name: Run auto-test (Software GFX)
      working-directory: ${{github.workspace}}/build/${{matrix.platform.bindir}}
      run: |
        ${{matrix.platform.runbin}} --gfxdriver Software --no-message-box --log-stdout=script:info,main:debug,game:warn --user-data-dir . ${{env.AUTO_TEST_ASSET_BASENAME}}.ags
        mv agstest.tap agstest_software.tap

    - name: Check auto-test (Software GFX) # we are using tap.py so that the pipeline fails if a test fails
      working-directory: ${{github.workspace}}/build/${{matrix.platform.bindir}}
      run: |
        tappy agstest_software.tap

  build-emscripten-bundle:
    name: Emscripten
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    env:
      EM_VERSION: 3.1.74
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install bsdtar
        run: sudo apt-get update -y && sudo apt-get install -y libarchive-tools

      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 #v16
        with:
          version: ${{env.EM_VERSION}}

      - name: Cache CMake FetchContent dependencies
        uses: actions/cache@v5
        with:
          path: ${{github.workspace}}/Emscripten/build/_deps
          key: fetchcontent-${{ runner.os }}-Emscripten-${{ hashFiles('CMakeLists.txt', 'CMake/Fetch*.cmake') }}

      - name: Configure and Build
        run: |
          cmake --version
          cd Emscripten && ./build.sh

      - name: Package Emscripten build
        run: |
          cd Emscripten && ./package.sh

      - uses: actions/upload-artifact@v7
        with:
          name: ags-bundle-emscripten
          path: ags_*_web.tar.gz

  build-android-bundle:
    name: Android
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install bsdtar
        run: sudo apt-get update -y && sudo apt-get install -y libarchive-tools

      - name: Set up Android SDK
        run: |
          cd Android && ./and-download-sdk-tools.sh linux
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME}/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"

      - name: Install Android NDK r25
        run: sdkmanager --install "ndk;25.2.9519653" "build-tools;34.0.0"

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # Gradle configures CMake eight times (four ABIs, debug and release), and each configure would
      # download every dependency: download them once, with retries, and keep them in the cache
      - name: Cache CMake dependency archives
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/ags-deps
          key: ags-deps-${{ hashFiles('CMake/Fetch*.cmake') }}

      - name: Download CMake dependency archives
        run: |
          Script/fetch_deps.sh "$RUNNER_TEMP/ags-deps"
          echo "AGS_FETCH_MIRROR_DIR=$RUNNER_TEMP/ags-deps" >> "$GITHUB_ENV"

      - name: Prepare Android build
        run: cd Android && ./and-build.sh prepare

      - name: Build debug APK
        run: cd Android && ./and-build.sh build_debug

      - name: Build release APK
        run: cd Android && ./and-build.sh build_release

      - name: Rename APKs
        run: cd Android && ./and-build.sh archive_apks

      - name: Create project archive
        run: cd Android && ./and-build.sh archive_project

      - uses: actions/upload-artifact@v7
        with:
          name: android-apks
          path: AGS-*.apk

      - uses: actions/upload-artifact@v7
        with:
          name: ags-bundle-android
          path: AGS-*-android-proj-*.zip

  windows-deps:
    name: Windows Dependencies
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: microsoft/setup-msbuild@v3

      - name: Restore cached deps
        id: cache-win-deps
        uses: actions/cache@v5
        with:
          path: C:\Lib
          key: win-deps-${{ hashFiles('Windows/setup_ags_build_deps.bat') }}

      - name: Build dependencies
        if: steps.cache-win-deps.outputs.cache-hit != 'true'
        shell: cmd
        run: Windows\setup_ags_build_deps.bat

      - name: Build WinDevDependenciesVS archive
        shell: cmd
        run: |
          pushd "C:\Lib\SDL_sound"
          if exist build_x86 del /Q /S build_x86\* && rd /Q /S build_x86
          if exist build_x64 del /Q /S build_x64\* && rd /Q /S build_x64
          popd
          tar -f WinDevDependenciesVS.zip -acv --strip-components 2 C:\Lib
          dir WinDevDependenciesVS.zip

      - name: Upload WinDevDependenciesVS
        uses: actions/upload-artifact@v7
        with:
          # because archive is false, the name is the filename
          if-no-files-found: error
          archive: false
          path: WinDevDependenciesVS.zip

  windows-msvc-tests:
    name: Windows MSVC Tests
    runs-on: windows-2022
    needs: windows-deps
    timeout-minutes: 40
    env:
      AGS_LIBOGG_LIB:        C:\Lib\Xiph\x86
      AGS_LIBTHEORA_LIB:     C:\Lib\Xiph\x86
      AGS_LIBVORBIS_LIB:     C:\Lib\Xiph\x86
      AGS_SDL_INCLUDE:       C:\Lib\SDL2\include
      AGS_SDL_LIB:           C:\Lib\SDL2\lib\x86
      AGS_SDL_SOUND_INCLUDE: C:\Lib\SDL_sound\src
      AGS_SDL_SOUND_LIB:     C:\Lib\SDL_sound\lib\x86
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: true

      - uses: microsoft/setup-msbuild@v3

      - name: Download Windows dependencies
        uses: actions/download-artifact@v8
        with:
          name: WinDevDependenciesVS.zip
          path: C:\Lib

      - name: Build Compiler test runner (x86)
        shell: cmd
        run: |
          cd Solutions
          msbuild Compiler.Lib.sln /m /p:MultiProcessorCompilation=true /p:PlatformToolset=v143 /p:Configuration=Release /p:Platform=x86 /maxcpucount /nologo

      - name: Run Compiler tests (x86)
        run: Solutions\.test\x86\Release\Compiler.Lib.Test.exe

      - name: Build AGS test runners (x86)
        shell: cmd
        run: |
          cd Solutions
          msbuild Tests.sln /m /p:MultiProcessorCompilation=true /p:PlatformToolset=v143 /p:Configuration=Release /p:Platform=x86 /maxcpucount /nologo

      - name: Run Common tests (x86)
        run: Solutions\.test\x86\Release\Common.Lib.Test.exe

      - name: Run Engine tests (x86)
        run: Solutions\.test\x86\Release\Engine.App.Test.exe

      - name: Run Tools tests (x86)
        run: Solutions\.test\x86\Release\Tools.Test.exe

      - name: Clean up
        shell: cmd
        run: cd Solutions && rd /s /q .test

      - name: Build Compiler test runner (x64)
        shell: cmd
        run: |
          cd Solutions
          msbuild Compiler.Lib.sln /m /p:MultiProcessorCompilation=true /p:PlatformToolset=v143 /p:Configuration=Release /p:Platform=x64 /maxcpucount /nologo

      - name: Run Compiler tests (x64)
        run: Solutions\.test\x64\Release\Compiler.Lib.Test.exe

      - name: Build AGS test runners (x64)
        shell: cmd
        run: |
          cd Solutions
          msbuild Tests.sln /m /p:MultiProcessorCompilation=true /p:PlatformToolset=v143 /p:Configuration=Release /p:Platform=x64 /maxcpucount /nologo

      - name: Run Common tests (x64)
        run: Solutions\.test\x64\Release\Common.Lib.Test.exe

      - name: Run Engine tests (x64)
        run: Solutions\.test\x64\Release\Engine.App.Test.exe

      - name: Run Tools tests (x64)
        run: Solutions\.test\x64\Release\Tools.Test.exe

  windows-msvc-engine:
    name: Windows MSVC Engine
    runs-on: windows-2022
    needs: windows-deps
    timeout-minutes: 40
    env:
      AGS_LIBOGG_LIB:        C:\Lib\Xiph\x86
      AGS_LIBTHEORA_LIB:     C:\Lib\Xiph\x86
      AGS_LIBVORBIS_LIB:     C:\Lib\Xiph\x86
      AGS_SDL_INCLUDE:       C:\Lib\SDL2\include
      AGS_SDL_LIB:           C:\Lib\SDL2\lib\x86
      AGS_SDL_SOUND_INCLUDE: C:\Lib\SDL_sound\src
      AGS_SDL_SOUND_LIB:     C:\Lib\SDL_sound\lib\x86
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: microsoft/setup-msbuild@v3

      - name: Download Windows dependencies
        uses: actions/download-artifact@v8
        with:
          name: WinDevDependenciesVS.zip
          path: C:\Lib

      - name: Build Engine (x86 Debug)
        shell: cmd
        run: |
          cd Solutions
          msbuild Engine.sln /m /p:MultiProcessorCompilation=true /p:PlatformToolset=v143 /p:Configuration=Debug /p:Platform=x86 /maxcpucount /nologo

      - name: Build Engine (x86 Release)
        shell: cmd
        run: |
          cd Solutions
          msbuild Engine.sln /m /p:MultiProcessorCompilation=true /p:PlatformToolset=v143 /p:Configuration=Release /p:Platform=x86 /maxcpucount /nologo

      - name: Upload x86 Engine PDBs
        uses: actions/upload-artifact@v7
        with:
          name: windows-engine-pdb-x86
          include-hidden-files: true
          path: Solutions/.build/*/*/acwin.pdb

      - name: Delete x86 PDB / intermediate files
        shell: cmd
        run: |
          cd Solutions\.build
          del /s /q *.pdb *.map *.ilk *.iobj *.ipdb

      - name: Upload x86 binaries
        uses: actions/upload-artifact@v7
        with:
          name: windows-engine-binaries-x86
          include-hidden-files: true
          path: Solutions/.build/*/*

      - name: Delete x86 build output
        shell: cmd
        run: cd Solutions && rd /s /q .build

      - name: Build Engine (x64 Release)
        shell: cmd
        run: |
          cd Solutions
          msbuild Engine.sln /m /p:MultiProcessorCompilation=true /p:PlatformToolset=v143 /p:Configuration=Release /p:Platform=x64 /maxcpucount /nologo

      - name: Upload x64 Engine PDBs
        uses: actions/upload-artifact@v7
        with:
          name: windows-engine-pdb-x64
          include-hidden-files: true
          path: Solutions/.build/*/*/acwin.pdb

      - name: Delete x64 PDB / intermediate files
        shell: cmd
        run: |
          cd Solutions\.build
          del /s /q *.pdb *.map *.ilk *.iobj *.ipdb

      - name: Upload x64 binaries
        uses: actions/upload-artifact@v7
        with:
          name: windows-engine-binaries-x64
          include-hidden-files: true
          path: Solutions/.build/*/*

  windows-msvc-tools:
    name: Windows MSVC Tools
    runs-on: windows-2022
    needs: windows-deps
    timeout-minutes: 40
    env:
      AGS_SDL_INCLUDE:       C:\Lib\SDL2\include
      AGS_SDL_LIB:           C:\Lib\SDL2\lib\x86
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: microsoft/setup-msbuild@v3

      - name: Download Windows dependencies
        uses: actions/download-artifact@v8
        with:
          name: WinDevDependenciesVS.zip
          path: C:\Lib

      - name: Build Tools (x86 Debug)
        shell: cmd
        run: |
          cd Solutions
          msbuild Tools.sln /m /p:MultiProcessorCompilation=true /p:PlatformToolset=v143 /p:Configuration=Debug /p:Platform=x86 /maxcpucount /nologo     

      - name: Build Compiler (x86 Debug)
        shell: cmd
        run: |
          cd Solutions
          msbuild Compiler.App.sln /m /p:MultiProcessorCompilation=true /p:PlatformToolset=v143 /p:Configuration=Debug /p:Platform=x86 /maxcpucount /nologo

      - name: Build Tools (x86 Release)
        shell: cmd
        run: |
          cd Solutions
          msbuild Tools.sln /m /p:MultiProcessorCompilation=true /p:PlatformToolset=v143 /p:Configuration=Release /p:Platform=x86 /maxcpucount /nologo

      - name: Build Compiler (x86 Release)
        shell: cmd
        run: |
          cd Solutions
          msbuild Compiler.App.sln /m /p:MultiProcessorCompilation=true /p:PlatformToolset=v143 /p:Configuration=Release /p:Platform=x86 /maxcpucount /nologo

      - name: Upload x86 Tools PDBs
        uses: actions/upload-artifact@v7
        with:
          name: windows-tools-pdb-x86
          include-hidden-files: true
          path: Solutions/.build/*/*/*.pdb

      - name: Delete x86 PDB / intermediate files
        shell: cmd
        run: |
          cd Solutions\.build
          del /s /q *.pdb *.map *.ilk *.iobj *.ipdb

      - name: Upload x86 Tools binaries
        uses: actions/upload-artifact@v7
        with:
          name: windows-tools-binaries-x86
          include-hidden-files: true
          path: Solutions/.build/*/*

      - name: Delete x86 build output
        shell: cmd
        run: cd Solutions && rd /s /q .build

      - name: Build Tools (x64 Release)
        shell: cmd
        run: |
          cd Solutions
          msbuild Tools.sln /m /p:MultiProcessorCompilation=true /p:PlatformToolset=v143 /p:Configuration=Release /p:Platform=x64 /maxcpucount /nologo

      - name: Build Compiler (x64 Release)
        shell: cmd
        run: |
          cd Solutions
          msbuild Compiler.App.sln /m /p:MultiProcessorCompilation=true /p:PlatformToolset=v143 /p:Configuration=Release /p:Platform=x64 /maxcpucount /nologo

      - name: Upload x64 Tools PDBs
        uses: actions/upload-artifact@v7
        with:
          name: windows-tools-pdb-x64
          include-hidden-files: true
          path: Solutions/.build/*/*/*.pdb

      - name: Delete x64 PDB / intermediate files
        shell: cmd
        run: |
          cd Solutions\.build
          del /s /q *.pdb *.map *.ilk *.iobj *.ipdb

      - name: Upload x64 Tools binaries
        uses: actions/upload-artifact@v7
        with:
          name: windows-tools-binaries-x64
          include-hidden-files: true
          path: Solutions/.build/*/*

  windows-msvc-editor:
    name: Windows MSVC Editor
    runs-on: windows-2022
    needs: windows-deps
    timeout-minutes: 40
    env:
      AGS_LIBOGG_LIB:        C:\Lib\Xiph\x86
      AGS_LIBTHEORA_LIB:     C:\Lib\Xiph\x86
      AGS_LIBVORBIS_LIB:     C:\Lib\Xiph\x86
      AGS_SDL_INCLUDE:       C:\Lib\SDL2\include
      AGS_SDL_LIB:           C:\Lib\SDL2\lib\x86
      AGS_SDL_SOUND_INCLUDE: C:\Lib\SDL_sound\src
      AGS_SDL_SOUND_LIB:     C:\Lib\SDL_sound\lib\x86
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: microsoft/setup-msbuild@v3

      - name: Download Windows dependencies
        uses: actions/download-artifact@v8
        with:
          name: WinDevDependenciesVS.zip
          path: C:\Lib

      - name: Copy irrKlang DLLs to Editor\References
        shell: pwsh
        run: |
          Copy-Item C:\Lib\irrKlang\x86\*.dll Editor\References\
          New-Item -ItemType Directory -Path Editor\References\x64 -Force
          Copy-Item C:\Lib\irrKlang\x64\*.dll Editor\References\x64

      - name: Cache NuGet packages
        id: cache-nuget
        uses: actions/cache@v5
        with:
          path: Solutions\packages
          key: nuget-${{ hashFiles('Editor/AGS.Editor/packages.config', 'Editor/AGS.Types/packages.config', 'Editor/AGS.Editor.Tests/packages.config') }}

      - name: Restore NuGet packages
        if: steps.cache-nuget.outputs.cache-hit != 'true'
        shell: cmd
        run: nuget restore Solutions\AGS.Editor.Full.sln

      - name: Build Editor (Debug)
        shell: cmd
        run: |
          cd Solutions
          msbuild AGS.Editor.Full.sln /m /p:MultiProcessorCompilation=true /p:PlatformToolset=v143 /p:Configuration=Debug /p:Platform=x86 /maxcpucount /nologo

      - name: Run NUnit tests (Debug)
        shell: cmd
        run: |
          pushd Solutions\packages\NUnit.ConsoleRunner.3.*
          set RUNNER="%CD%\tools\nunit3-console.exe"
          popd
          cmd /v:on /c "!RUNNER! Solutions\.test\x86\Debug\AGS.Editor.Tests.dll --result=TestResult-junit.xml;transform=Editor\AGS.Editor.Tests\nunit3-junit.xslt"

      - name: Build Editor (Release)
        shell: cmd
        run: |
          cd Solutions
          msbuild AGS.Editor.Full.sln /m /p:MultiProcessorCompilation=true /p:PlatformToolset=v143 /p:Configuration=Release /p:Platform=x86 /maxcpucount /nologo

      - name: Run NUnit tests (Release)
        shell: cmd
        run: |
          pushd Solutions\packages\NUnit.ConsoleRunner.3.*
          set RUNNER="%CD%\tools\nunit3-console.exe"
          popd
          cmd /v:on /c "!RUNNER! Solutions\.test\x86\Release\AGS.Editor.Tests.dll --result=TestResult-junit.xml;transform=Editor\AGS.Editor.Tests\nunit3-junit.xslt"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: editor-test-results
          include-hidden-files: true
          path: TestResult-junit.xml

      - name: Upload Editor PDBs
        uses: actions/upload-artifact@v7
        with:
          name: windows-editor-pdb
          include-hidden-files: true
          path: Solutions/.build/*/*/*.pdb

      - name: Delete Editor PDBs and XML docs
        shell: cmd
        run: |
          cd Solutions\.build
          del /s /q *.pdb *.xml

      - name: Upload Editor Release binaries
        uses: actions/upload-artifact@v7
        with:
          name: windows-editor-binaries
          include-hidden-files: true
          path: Solutions/.build/x86/Release/*

  # Builds the auto-test project with the editor and with agsbuild, and fails unless the packages
  # match file by file (docs/refactor/PLAN.md, 7.1j). Goes away with the C# build code (6.7d).
  windows-parity:
    name: Windows Build Parity
    runs-on: windows-2022
    needs:
      - build
      - windows-deps
      - windows-msvc-engine
      - windows-msvc-editor
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out the auto-test project
        uses: actions/checkout@v6
        with:
          repository: ${{env.AUTO_TEST_REPO}}
          ref: ${{env.AUTO_TEST_TAG}}
          path: auto-test-source
          persist-credentials: false

      - name: Download Windows dependencies
        uses: actions/download-artifact@v8
        with:
          name: WinDevDependenciesVS.zip
          path: C:\Lib

      - name: Download Editor binaries
        uses: actions/download-artifact@v8
        with:
          name: windows-editor-binaries
          path: parity-editor

      - name: Download Engine x86 binary
        uses: actions/download-artifact@v8
        with:
          name: windows-engine-binaries-x86
          path: parity-engine

      - name: Download tools
        uses: actions/download-artifact@v8
        with:
          name: parity-tools-windows
          path: parity-tools

      # The editor copies the engine into the game's output, so it sits next to AGSEditor.exe
      - name: Put the engine next to the editor
        shell: cmd
        run: |
          copy parity-engine\x86\Release\acwin.exe parity-editor\acwin.exe
          copy C:\Lib\SDL2\lib\x86\SDL2.dll parity-editor\SDL2.dll

      - name: Compare the editor build with agsbuild
        run: >
          python Script/compare_builds.py auto-test-source/ags4/auto-test
          --editor parity-editor/AGSEditor.exe
          --build-dir parity-tools
          --engine parity-tools/ags.exe
          --work-dir ${{runner.temp}}/parity

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parity-logs
          path: |
            ${{runner.temp}}/parity/*.log

  package-pdbs:
    name: PDB Packaging
    runs-on: ubuntu-latest
    if: needs.plan.outputs.full == 'true'
    needs:
      - plan
      - windows-msvc-engine
      - windows-msvc-editor
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download Engine x86 PDBs
        uses: actions/download-artifact@v8
        with:
          name: windows-engine-pdb-x86
          path: pdbs/

      - name: Download Engine x64 PDBs
        uses: actions/download-artifact@v8
        with:
          name: windows-engine-pdb-x64
          path: pdbs/

      - name: Download Editor PDBs
        uses: actions/download-artifact@v8
        with:
          name: windows-editor-pdb
          path: pdbs/

      - name: Install bsdtar
        run: sudo apt-get update -y && sudo apt-get install -y libarchive-tools

      - name: Create PDB archive
        run: |
          version=$(awk -F'[ "]+' '$1=="#define" && $2=="ACI_VERSION_STR" { print $3; exit }' Common/ac/def_version.h)
          bsdtar -f "AGS-${version}-pdb.zip" -acv pdbs/

      - name: Upload PDB archive
        uses: actions/upload-artifact@v7
        with:
          name: pdb-archive
          include-hidden-files: true
          path: AGS-*-pdb.zip

  linux-binaries-builds:
    name: Linux (${{ matrix.platform.arch }}, ${{ matrix.platform.rpath && 'Tar.gz' || 'Deb PKG' }})
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        platform:
        - { arch: amd64, rpath: true,  os: ubuntu-latest }
        - { arch: i386,  rpath: true,  os: ubuntu-latest }
        - { arch: amd64, rpath: false, os: ubuntu-latest }
        - { arch: i386,  rpath: false, os: ubuntu-latest }

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 #v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run build inside container
        run: |
          TAG_NAME=${{ env.BASE_BRANCH }}-${{ matrix.platform.arch }}
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/$OWNER/ags-linux-builder-image:$TAG_NAME"
          if [ "${{matrix.platform.rpath}}" = "true" ]; then
            PREFIX=lib
          else
            PREFIX=
          fi

          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e RPATH_PREFIX=$PREFIX \
            "$IMAGE" \
            bash debian/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-deb-${{ matrix.platform.arch }}${{ matrix.platform.rpath && '-rpath' || '' }}
          path: ${{ matrix.platform.rpath && 'data_*.tar.gz' || 'ags_*.deb' }}

  build-linux-bundle:
    name: Linux Bundle
    needs: [plan, linux-binaries-builds]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install bsdtar
        run: sudo apt-get update -y && sudo apt-get install -y libarchive-tools

      - name: Download amd64 data archive
        uses: actions/download-artifact@v8
        with:
          name: linux-deb-amd64-rpath
          path: /tmp/linux-amd64

      - name: Download i386 data archive
        uses: actions/download-artifact@v8
        with:
          name: linux-deb-i386-rpath
          path: /tmp/linux-i386

      - name: Assemble Linux bundle
        run: |
          set -e
          tmp=$(mktemp -d)
          mkdir -p $tmp/data
          bsdtar -f /tmp/linux-amd64/data_amd64.tar.gz -xvzC $tmp/data
          bsdtar -f /tmp/linux-i386/data_i386.tar.gz   -xvzC $tmp/data
          cp -v debian/copyright $tmp/data/licenses/ags-copyright
          cp -v debian/ags+libraries/startgame $tmp/
          awk 'BEGIN { RS="" } !/make_ags/ { if (NR>1) print RS; print }' debian/ags+libraries/README > $tmp/README
          version=$(awk -F'[ "]+' '$1=="#define" && $2=="ACI_VERSION_STR" { print $3; exit }' Common/ac/def_version.h)
          bsdtar -f ags_${version}_linux.tar.gz -cvzC $tmp data startgame README

      - uses: actions/upload-artifact@v7
        with:
          name: ags-bundle-linux
          path: ags_*_linux.tar.gz

  macos-tools-builds:
    name: macOS Tools (arm64)
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build Tools on macOS
        run: |
          set -e
          PREFIX="$PWD/dist-tools/usr/local"
          find Tools -name Makefile -execdir make -j4 PREFIX="$PREFIX" install \;
          make -j4 --directory=Compiler PREFIX="$PREFIX" install

      - name: Create macOS Tools archive
        run: |
          set -e
          version=$(awk -F'[ "]+' '$1=="#define" && $2=="ACI_VERSION_STR" { print $3; exit }' Common/ac/def_version.h)
          mkdir -p MacOS/Tools/arm64
          cp -v dist-tools/usr/local/bin/* MacOS/Tools/arm64/
          bsdtar -f "AGS-Tools-${version}-macos.tar.gz" -cvzC MacOS/Tools arm64

      - name: Upload macOS Tools artifact
        uses: actions/upload-artifact@v7
        with:
          name: tools-macos-archive
          path: AGS-Tools-*-macos.tar.gz

  linux-make-tools:
    name: Linux Tools (${{ matrix.platform.archname }})
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        platform:
        - { arch: amd64, archname: x64, os: ubuntu-latest }
        - { arch: i386,  archname: x86, os: ubuntu-latest }

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install bsdtar
        run: sudo apt-get update -y && sudo apt-get install -y libarchive-tools

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 #v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run build inside container ${{ matrix.platform.archname }}
        run: |
          TAG_NAME=${{ env.BASE_BRANCH }}-${{ matrix.platform.arch }}
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/$OWNER/ags-linux-builder-image:$TAG_NAME"

          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$IMAGE" \
            bash -c 'find Tools -name Makefile -execdir make -j4 PREFIX=/workspace/dist-tools/usr/local install \; && make -j4 --directory=Compiler PREFIX=/workspace/dist-tools/usr/local install'

      - name: Create Linux Tools archive ${{ matrix.platform.archname }}
        run: |
          bsdtar -f "linux-tools-${{ matrix.platform.archname }}.tar.gz" -cvzC dist-tools/usr/local/bin .

      - name: Upload Linux Tools artifact ${{ matrix.platform.archname }}
        uses: actions/upload-artifact@v7
        with:
          name: tools-linux-archive-${{ matrix.platform.archname }}
          path: linux-tools-${{ matrix.platform.archname }}.tar.gz

  package-tools-archives:
    name: Tools Packaging
    runs-on: ubuntu-latest
    if: needs.plan.outputs.full == 'true'
    needs:
      - plan
      - windows-msvc-tools
      - linux-make-tools
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install bsdtar
        run: sudo apt-get update -y && sudo apt-get install -y libarchive-tools

      - name: Download Windows x64 Tools binaries
        uses: actions/download-artifact@v8
        with:
          name: windows-tools-binaries-x64
          path: tmp_win_tools/x64

      - name: Download Windows x86 Tools binaries
        uses: actions/download-artifact@v8
        with:
          name: windows-tools-binaries-x86
          path: tmp_win_tools/x86

      - name: Create Windows Tools archive
        run: |
          version=$(awk -F'[ "]+' '$1=="#define" && $2=="ACI_VERSION_STR" { print $3; exit }' Common/ac/def_version.h)
          mkdir -p Win/Tools/x86
          mkdir -p Win/Tools/x64
          cp tmp_win_tools/x86/x86/Release/*.exe Win/Tools/x86/
          cp tmp_win_tools/x64/x64/Release/*.exe Win/Tools/x64/
          bsdtar -f "AGS-Tools-${version}.zip" -acvC Win/Tools x86 x64
          rm -rf tmp_win_tools
          rm -rf Win/Tools

      - name: Upload Windows Tools archive
        uses: actions/upload-artifact@v7
        with:
          name: tools-windows-archive
          include-hidden-files: true
          path: AGS-Tools-*.zip

      - name: Download Linux x64 Tools binaries
        uses: actions/download-artifact@v8
        with:
          name: tools-linux-archive-x64
          path: tmp_linux_tools/x64

      - name: Download Linux x86 Tools binaries
        uses: actions/download-artifact@v8
        with:
          name: tools-linux-archive-x86
          path: tmp_linux_tools/x86

      - name: Create Linux Tools archive
        run: |
          version=$(awk -F'[ "]+' '$1=="#define" && $2=="ACI_VERSION_STR" { print $3; exit }' Common/ac/def_version.h)
          mkdir -p Linux/Tools/x86
          mkdir -p Linux/Tools/x64
          bsdtar -f tmp_linux_tools/x86/linux-tools-x86.tar.gz -xvzC Linux/Tools/x86
          bsdtar -f tmp_linux_tools/x64/linux-tools-x64.tar.gz -xvzC Linux/Tools/x64
          bsdtar -f "AGS-Tools-${version}-Linux.tar.gz" -cvzC Linux/Tools x86 x64
          rm -rf tmp_linux_tools
          rm -rf Linux/Tools

      - name: Upload Linux Tools archive
        uses: actions/upload-artifact@v7
        with:
          name: tools-linux-archive
          include-hidden-files: true
          path: AGS-Tools-*-Linux.tar.gz

  windows-packaging:
    name: Windows Packaging
    runs-on: windows-2022
    timeout-minutes: 60
    if: needs.plan.outputs.full == 'true'
    needs:
      - plan
      - build-emscripten-bundle
      - build-android-bundle
      - build-linux-bundle
      - windows-deps
      - windows-msvc-editor
      - windows-msvc-engine
    env:
      TEMPLATES_REPOSITORY: adventuregamestudio/ags-templates
      DEMOGAME_REPOSITORY: adventuregamestudio/ags-demo-game
      AGS_SDL_LIB: C:\Lib\SDL2\lib\x86
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download Windows dependencies
        uses: actions/download-artifact@v8
        with:
          name: WinDevDependenciesVS.zip
          path: C:\Lib

      - name: Download Editor binaries
        uses: actions/download-artifact@v8
        with:
          name: windows-editor-binaries
          path: Windows\Installer\Source\Editor

      - name: Download Engine x86 binary
        uses: actions/download-artifact@v8
        with:
          name: windows-engine-binaries-x86
          path: Windows\Installer\Source\Engine_tmp

      - name: Copy vcredist, acwin.exe and SDL2.dll
        shell: cmd
        run: |
          mkdir Windows\Installer\Source\Redist
          mkdir Windows\Installer\Source\Engine
          copy C:\Lib\VcRedist\vc_redist.x86.exe Windows\Installer\Source\Redist\vc_redist.x86.exe
          copy Windows\Installer\Source\Engine_tmp\x86\Release\acwin.exe Windows\Installer\Source\Engine\acwin.exe
          copy %AGS_SDL_LIB%\SDL2.dll Windows\Installer\Source\Engine\SDL2.dll

      - name: Download AGS manual
        shell: cmd
        run: |
          mkdir Windows\Installer\Source\Docs
          cd Windows\Installer\Source\Docs
          curl -fLJ https://github.com/adventuregamestudio/ags-manual/releases/latest/download/${{env.MANUAL_ASSET}} -o ags-help.chm

      - name: Download AGS templates
        shell: cmd
        run: |
          mkdir Windows\Installer\Source\Templates
          curl -fLSs https://github.com/%TEMPLATES_REPOSITORY%/tarball/${{env.BASE_BRANCH}} | tar -f - -xvzC Windows\Installer\Source\Templates --strip-components 2

      - name: Download Linux bundle
        uses: actions/download-artifact@v8
        with:
          name: ags-bundle-linux
          path: _linux_tmp

      - name: Extract Linux bundle
        shell: cmd
        run: |
          mkdir Windows\Installer\Source\Linux
          call Script\setvar.cmd ACI_VERSION_STR
          tar -f _linux_tmp\ags_%ACI_VERSION_STR%_linux.tar.gz -xvC Windows\Installer\Source\Linux --strip-components 1
          rd /s /q _linux_tmp

      - name: Download Emscripten bundle
        uses: actions/download-artifact@v8
        with:
          name: ags-bundle-emscripten
          path: _ems_tmp

      - name: Extract Emscripten files
        shell: cmd
        run: |
          mkdir Windows\Installer\Source\Web
          call Script\setvar.cmd ACI_VERSION_STR
          tar -f _ems_tmp\ags_%ACI_VERSION_STR%_web.tar.gz -xvC Windows\Installer\Source\Web
          rd /s /q _ems_tmp

      - name: Download Android project archive
        uses: actions/download-artifact@v8
        with:
          name: ags-bundle-android
          path: _android_tmp

      - name: Extract Android project
        shell: cmd
        run: |
          mkdir Windows\Installer\Source\Android
          call Script\setvar.cmd ACI_VERSION_STR
          tar -f _android_tmp\AGS-%ACI_VERSION_STR%-android-proj-release.zip -xvzC Windows\Installer\Source\Android
          rd /s /q _android_tmp

      - name: Download Demo game
        shell: cmd
        run: |
          mkdir Windows\Installer\Source\AGSQuest
          curl -fLSs https://github.com/%DEMOGAME_REPOSITORY%/releases/latest/download/AGSQuest.zip | tar -f - -xvzC Windows\Installer\Source\AGSQuest --strip-components 1

      #   NOTE: Inno Setup 6.7.1 comes preinstalled in Windows runners.
      #   It looks like it is also in PATH already, but our script expects its
      # path through a parameter.
      #   I will run it without anything because it should print the version
      # and information that we can use to monitor what is pre-installed and
      # if it changes.
      - name: Run Inno Setup
        shell: pwsh
        run: |
          ISCC.exe
          Windows\Installer\build.ps1 -IsccPath 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: ags-installer
          path: Windows\Installer\Output\*.exe

      - name: Build release archive
        shell: cmd
        run: |
          move Windows\Installer\Source\Docs\* Windows\Installer\Source\Editor\
          move Windows\Installer\Source\Engine\* Windows\Installer\Source\Editor\
          move Windows\Installer\Source\Licenses Windows\Installer\Source\Editor\
          move Windows\Installer\Source\Linux     Windows\Installer\Source\Editor\
          move Windows\Installer\Source\Web       Windows\Installer\Source\Editor\
          move Windows\Installer\Source\Android   Windows\Installer\Source\Editor\
          move Windows\Installer\Source\Templates Windows\Installer\Source\Editor\
          move Windows\Installer\Source\URLs Windows\Installer\Source\Editor\
          for %%f in (Windows\Installer\Output\*.exe) do tar -f %%~nf.zip -acv --strip-components 4 Windows\Installer\Source\Editor

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: ags-archive
          path: AGS-*.zip

  make-release:
    name: Release Packaging
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: needs.plan.outputs.full == 'true'
    needs:
      - plan
      - build-emscripten-bundle
      - build-android-bundle
      - build-linux-bundle
      - windows-packaging
      - package-tools-archives
      - package-pdbs
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update -y && sudo apt-get install -y libarchive-tools

      - name: Read version string
        id: version
        run: |
          version=$(awk -F'[ "]+' '$1=="#define" && $2=="ACI_VERSION_STR" { print $3; exit }' Common/ac/def_version.h)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # source archive formats used by downstream when packaging ags
      - name: Create source archives
        run: |
          version=${{ steps.version.outputs.version }}
          mkdir -p /tmp/github_release
          for ext in tar.gz tar.xz zip; do
            echo "Writing ${ext} archive..."
            bsdtar -f "/tmp/github_release/ags_${version}_source.${ext}" \
              -acs "!\./\(.*\)!ags_${version}_source/\1!" \
              --exclude ".git*" \
              --exclude ".github" \
              --exclude ".cirrus.yml" \
              .
          done

      - name: Download installer
        uses: actions/download-artifact@v8
        with:
          name: ags-installer
          path: /tmp/github_release

      - name: Download release archive
        uses: actions/download-artifact@v8
        with:
          name: ags-archive
          path: /tmp/github_release

      - name: Download WinDevDependenciesVS
        uses: actions/download-artifact@v8
        with:
          name: WinDevDependenciesVS.zip
          skip-decompress: true
          path: /tmp/github_release

      - name: Download Linux bundle
        uses: actions/download-artifact@v8
        with:
          name: ags-bundle-linux
          path: /tmp/github_release

      - name: Download Emscripten bundle
        uses: actions/download-artifact@v8
        with:
          name: ags-bundle-emscripten
          path: /tmp/github_release

      - name: Download PDB archive
        uses: actions/download-artifact@v8
        with:
          name: pdb-archive
          path: /tmp/github_release

      - name: Download Linux .deb packages
        uses: actions/download-artifact@v8
        with:
          pattern: linux-deb-{amd64,i386}
          path: /tmp/github_release
          merge-multiple: true

      - name: Download Android APKs
        uses: actions/download-artifact@v8
        with:
          name: android-apks
          path: /tmp/github_release

      - name: Download Android project bundle
        uses: actions/download-artifact@v8
        with:
          name: ags-bundle-android
          path: /tmp/github_release

      - name: Download Windows Tools archive
        uses: actions/download-artifact@v8
        with:
          name: tools-windows-archive
          path: /tmp/github_release

      - name: Download Linux Tools archive
        uses: actions/download-artifact@v8
        with:
          name: tools-linux-archive
          path: /tmp/github_release

      - name: Generate SHA-256 checksums
        run: |
          cd /tmp/github_release
          sha256sum * | tee checksums.sha256

      - run: |
          ls -la /tmp/github_release/*

      - name: Create Release and Upload assets
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          if gh release view "${tag}" > /dev/null 2>&1; then
            echo "Release ${tag} already exists, skipping creation."
          else
            gh release create "${tag}" --title "${tag}"
          fi

          for fpath in /tmp/github_release/*; do
            echo "Uploading ${fpath}"
            gh release upload "${tag}" "${fpath}"
          done